<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
</head>

<body>

    <h1>Task List</h1>

    <table border="1">

        <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Task</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody>

            {% for task in tasks %}

            <tr>
                <td>{{ task.date }}</td>
                <td>{{ task.time }}</td>
                <td>{{ task.text }}</td>

                <td>
                    <a href="{% url 'edit_task' task.id %}">
                        Edit
                    </a>
                </td>

                <td>
                    
                    <a href="{% url 'delete_list_item' task.id %}"
                        onclick="return confirm('Are you sure you want to delete this task?');">
                        Delete
                    </a>
                </td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="5">
                    No tasks found.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <br>

    <a href="{% url 'home' %}">
        <button type="button">Add Task</button>
    </a>

</body>

</html>
