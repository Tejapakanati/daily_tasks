<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
</head>

<body>

    <h1>Edit Task</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Date</label>
        <input type="date"
               name="date"
               value="{{ task.date|date:'Y-m-d' }}"
               required>

        <br><br>

        <label>Time</label>
        <input type="time"
               name="time"
               value="{{ task.time|time:'H:i' }}"
               required>

        <br><br>

        <label>Task</label>
        <br>

        <textarea name="text"
                  rows="8"
                  cols="60"
                  required>{{ task.text }}</textarea>

        <br><br>

        <button type="submit">Update Task</button>

    </form>

    <br>

    <a href="{% url 'task_list' %}">
        <button type="button">Back to Task List</button>
    </a>

</body>

</html>
